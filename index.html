<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#EEF1F6" />
    <script>
      // Pick the theme before first paint so dark mode never flashes light. Kept in sync by src/theme.ts.
      try {
        var t = localStorage.getItem('wb:theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        document.documentElement.dataset.theme = t
        document.querySelector('meta[name=theme-color]').content = t === 'dark' ? '#151B2C' : '#EEF1F6'
      } catch (e) {}
    </script>
    <meta name="description" content="Learn your English words, one card at a time." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Caveat:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <title>Word Box</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
